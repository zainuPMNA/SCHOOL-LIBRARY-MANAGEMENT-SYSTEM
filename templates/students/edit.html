{% extends "base.html" %}

{% block title %}Edit Student{% endblock %}
{% block header %}Edit Student: {{ student.name }}{% endblock %}

{% block header_actions %}
<a href="{{ url_for('students.index') }}" class="btn btn-secondary"><i class='bx bx-arrow-back'></i> Back to Students</a>
{% endblock %}

{% block content %}
<div class="glass-card" style="max-width: 600px; margin: 0 auto;">
    <form action="{{ url_for('students.edit', id=student.id) }}" method="POST">
        <div class="form-group">
            <label for="roll_no">Roll No</label>
            <input type="text" id="roll_no" name="roll_no" class="form-control" value="{{ student.roll_no }}" required>
        </div>
        
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" class="form-control" value="{{ student.name }}" required>
        </div>
        
        <div class="form-group">
            <label for="class_name">Class</label>
            <input type="text" id="class_name" name="class_name" class="form-control" value="{{ student.class_name }}" required>
        </div>
        
        <div class="form-group">
            <label for="division">Division</label>
            <input type="text" id="division" name="division" class="form-control" value="{{ student.division }}" required>
        </div>
        
        <button type="submit" class="btn btn-success" style="width: 100%;"><i class='bx bx-save'></i> Save Changes</button>
    </form>
</div>
{% endblock %}
