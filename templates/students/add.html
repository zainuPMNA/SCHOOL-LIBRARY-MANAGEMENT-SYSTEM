{% extends "base.html" %}

{% block title %}Add Student{% endblock %}
{% block header %}Add New Student{% endblock %}

{% block header_actions %}
<a href="{{ url_for('students.index') }}" class="btn btn-danger"><i class='bx bx-left-arrow-alt'></i> Back</a>
{% endblock %}

{% block content %}
<div class="glass-card" style="max-width: 600px; margin: 0 auto;">
    <form action="{{ url_for('students.add') }}" method="POST">
        <div class="form-group">
            <label for="roll_no">Roll No.</label>
            <input type="text" id="roll_no" name="roll_no" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label for="class_name">Class</label>
            <input type="text" id="class_name" name="class_name" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label for="division">Division</label>
            <input type="text" id="division" name="division" class="form-control" required>
        </div>
        
        <button type="submit" class="btn btn-success" style="width: 100%;"><i class='bx bx-save'></i> Save Student</button>
    </form>
</div>
{% endblock %}
