{% extends "base.html" %}

{% block title %}Account Settings{% endblock %}

{% block header %}Account Settings{% endblock %}

{% block content %}
<div style="max-width: 520px; margin: 2rem auto;">
    <div class="glass-card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div style="width: 54px; height: 54px; border-radius: 50%; background: rgba(99, 102, 241, 0.2); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 0.5rem;">
                <i class='bx bx-user-circle' style="font-size: 2rem; color: var(--primary-color);"></i>
            </div>
            <h3 style="font-size: 1.25rem;">My Account Profile Settings</h3>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Role: <strong style="color: white;">{{ user_role_display }}</strong></p>
        </div>

        <form method="POST" action="{{ url_for('auth.change_password') }}">
            <div class="form-group">
                <label for="username"><i class='bx bx-user'></i> Username</label>
                <input type="text" id="username" name="username" class="form-control" value="{{ user.username if user else current_user_name }}" required>
            </div>

            <div class="form-group">
                <label for="current_password"><i class='bx bx-lock-alt'></i> Current Password <span style="color: #f87171;">*</span></label>
                <input type="password" id="current_password" name="current_password" class="form-control" placeholder="Enter current password to save changes" required>
            </div>

            <div style="border-top: 1px solid var(--border-color); margin: 1.5rem 0; padding-top: 1rem;">
                <h4 style="font-size: 0.95rem; color: var(--text-muted); margin-bottom: 1rem;">Change Password (Optional)</h4>
                
                <div class="form-group">
                    <label for="new_password"><i class='bx bx-key'></i> New Password</label>
                    <input type="password" id="new_password" name="new_password" class="form-control" placeholder="Enter new password (leave blank to keep current)" minlength="4">
                </div>

                <div class="form-group">
                    <label for="confirm_password"><i class='bx bx-check-shield'></i> Confirm New Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter new password" minlength="4">
                </div>
            </div>

            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 1.5rem;">
                <a href="{{ url_for('dashboard.index') }}" class="btn" style="background: rgba(255,255,255,0.1); color: white;">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Profile Settings</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
