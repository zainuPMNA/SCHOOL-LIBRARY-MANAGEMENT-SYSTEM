{% extends "base.html" %}

{% block title %}Add Book{% endblock %}
{% block header %}Add New Book{% endblock %}

{% block header_actions %}
<a href="{{ url_for('books.index') }}" class="btn btn-danger"><i class='bx bx-left-arrow-alt'></i> Back</a>
{% endblock %}

{% block content %}
<div class="glass-card" style="max-width: 800px; margin: 0 auto;">
    <form action="{{ url_for('books.add') }}" method="POST">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
            <div class="form-group">
                <label for="title">Book Title</label>
                <input type="text" id="title" name="title" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label for="author">Author Name</label>
                <input type="text" id="author" name="author" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label for="language">Language</label>
                <input type="text" id="language" name="language" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label for="category">Category</label>
                <input type="text" id="category" name="category" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label for="copies">No. of Copies</label>
                <input type="number" id="copies" name="copies" class="form-control" min="1" value="1" required>
            </div>

            <div class="form-group">
                <label for="publisher">Publisher</label>
                <input type="text" id="publisher" name="publisher" class="form-control">
            </div>

            <div class="form-group">
                <label for="published_year">Published Year</label>
                <input type="number" id="published_year" name="published_year" class="form-control">
            </div>

            <div class="form-group">
                <label for="keywords">Keywords</label>
                <input type="text" id="keywords" name="keywords" class="form-control">
            </div>

            <div class="form-group">
                <label for="price">Price</label>
                <input type="number" id="price" name="price" class="form-control" step="0.01" min="0" value="0.00" required>
            </div>
        </div>
        
        <button type="submit" class="btn btn-success" style="width: 100%; margin-top: 1rem;"><i class='bx bx-save'></i> Save Book</button>
    </form>
</div>
{% endblock %}
